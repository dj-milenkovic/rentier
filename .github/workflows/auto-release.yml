name: Auto Release

# Manually triggered (workflow_dispatch) when ready to cut a release.
# Scans every commit since the previous release tag, derives the highest Conventional
# Commit bump among them, computes the next semver, creates an annotated git tag, then
# builds all platforms and publishes a GitHub Release — all within this single workflow.
#
# Version bump rules (Conventional Commits):
#   feat!: / fix!: / *!: or body contains "BREAKING CHANGE:" → MAJOR
#   feat: / feat(scope):                                      → MINOR
#   everything else                                           → PATCH
#
# Skip release: include [skip release] anywhere in the commit message.
#
# Dry run: tick "dry_run" (or dispatch with inputs[dry_run]=true), on any branch. Every job
# builds, smoke-tests and verifies exactly as for a real release, but no tag is pushed and no
# GitHub Release is created; the would-be release assets and notes are uploaded as one
# workflow artifact, "release-preview-<version>", instead.

on:
  workflow_dispatch:  # disabled auto-trigger; run manually when ready to release
    inputs:
      dry_run:
        description: 'Dry run: build and verify every release asset, but create no tag and no release'
        type: boolean
        default: false
      allow_no_user_changes:
        description: 'Release without user-facing changes (e.g. a dependency security fix): no merged PR has a release note; the app shows a generic line'
        type: boolean
        default: false

# Serialize releases so concurrent merges never compute the same tag.
# cancel-in-progress: false ensures both releases still happen, just sequentially.
concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.x'
  PROJECT_PATH: src/Rentier.Desktop/Rentier.Desktop.csproj
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # Velopack auto-update. Every release asset is a self-updating Velopack package (there is no
  # separate non-updating set), plus one update feed per channel (releases.<channel>.json + .nupkg).
  # Channels are named after the runtime: vpk adds the channel to file names only for
  # non-default channels, so the OS defaults (win, linux) would collide in one release.
  # The app reads the feed from REPO_URL (baked in via RentierUpdateFeedUrl), so a fork's
  # build updates from the fork.
  PACK_ID: Rentier
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. Resolve PR title → bump type → next semver tag
  # ──────────────────────────────────────────────────────────────────
  compute-version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      version:  ${{ steps.version.outputs.version }}
      tag:      ${{ steps.version.outputs.tag }}
      prev_tag: ${{ steps.bump.outputs.prev_tag }}
      skip:     ${{ steps.skip.outputs.skip }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check skip flag
        id: skip
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          BODY=$(git log -1 --pretty=%b)
          if echo "${SUBJECT}${BODY}" | grep -q '\[skip release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping release (\\[skip release\\] found in commit)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine bump type
        id: bump
        if: steps.skip.outputs.skip == 'false'
        run: |
          # Autorelease is manual now, so a single release can span many merges since
          # the previous tag. Scan every commit in that range (the same range the
          # release notes use) and take the HIGHEST bump: major > minor > patch.
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          RANGE="${PREV_TAG:+$PREV_TAG..}HEAD"   # no prior tag → scan all history

          if   git log "$RANGE" --no-merges --pretty=%s | grep -qP '^[a-z]+(\([^)]+\))?!:' \
            || git log "$RANGE" --no-merges --pretty=%b | grep -q 'BREAKING CHANGE:'; then
            BUMP="major"
          elif git log "$RANGE" --no-merges --pretty=%s | grep -qP '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          echo "bump=${BUMP}"         >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Range: ${RANGE}  →  Bump: ${BUMP}"

      - name: Compute next semver
        id: version
        if: steps.skip.outputs.skip == 'false'
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
          PREV_TAG: ${{ steps.bump.outputs.prev_tag }}
        run: |
          LATEST="${PREV_TAG:-v0.0.0}"

          VERSION="${LATEST#v}"
          MAJOR=$(echo "${VERSION}" | cut -d. -f1)
          MINOR=$(echo "${VERSION}" | cut -d. -f2)
          PATCH=$(echo "${VERSION}" | cut -d. -f3)

          case "${BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_TAG}"         >> "$GITHUB_OUTPUT"
          echo "Previous: ${LATEST}  →  Next: ${NEW_TAG} (${BUMP} bump)"

  # ──────────────────────────────────────────────────────────────────
  # 2. User-facing release notes (last 10 versions), shipped inside the app
  #    (Settings > What's new) and inside each update (vpk --releaseNotes).
  #    Old versions come from .github/release-notes/history.md; newer ones from the
  #    "## Release note" section of each merged PR's description.
  #    Runs before the tag: a release with no user-facing change stops here
  #    unless "Release without user-facing changes" is ticked.
  # ──────────────────────────────────────────────────────────────────
  release-notes:
    name: Build release notes
    needs: compute-version
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Collect PR descriptions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.compute-version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          git tag --list 'v*' > tags.txt
          dotnet run --project .github/tools/Rentier.ReleaseNotes -c Release -- plan \
            --history .github/release-notes/history.md --version "${VERSION}" --tags-file tags.txt > versions.txt
          echo "Versions that take their notes from PR descriptions:"; cat versions.txt

          while read -r ver; do
            [ -n "$ver" ] || continue
            # The PRs of a version: squash commits "(#N)" since the tag before it. The version
            # being released has no tag yet (or only a local one on a dry run), so it ends at HEAD.
            prev=$( (git tag --list 'v*'; echo "$ver") | sort -uV | grep -B1 -x "$ver" | head -n1 )
            [ "$prev" != "$ver" ] || prev=""
            end="$ver"; git rev-parse -q --verify "refs/tags/${ver}" >/dev/null || end=HEAD
            mkdir -p "pr-bodies/${ver}"
            git log "${prev:+${prev}..}${end}" --no-merges --format=%s \
              | grep -oE '\(#[0-9]+\)$' | tr -d '(#)' | sort -un \
              | while read -r pr; do
                  gh api "repos/${REPO}/pulls/${pr}" --jq '.body // ""' > "pr-bodies/${ver}/${pr}.md" \
                    || echo "::warning::Could not read the description of PR #${pr}"
                done
          done < versions.txt

      - name: Build release notes
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
          # Without it, a release whose PRs have no release note stops here (before the tag).
          ALLOW_NO_USER_CHANGES: ${{ inputs.allow_no_user_changes }}
        run: |
          mkdir -p release-notes-app
          dotnet run --project .github/tools/Rentier.ReleaseNotes -c Release -- build \
            --history .github/release-notes/history.md --version "${VERSION}" --tags-file tags.txt \
            --pr-bodies pr-bodies --out release-notes-app/release-notes.md \
            --allow-no-user-changes "${ALLOW_NO_USER_CHANGES:-false}"
          cat release-notes-app/release-notes.md

      - uses: actions/upload-artifact@v7.0.1
        with:
          # Not "release-*": the release job downloads that pattern into the release assets.
          name: app-release-notes
          path: release-notes-app/release-notes.md
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # 3. Create annotated git tag
  # ──────────────────────────────────────────────────────────────────
  tag:
    name: Create git tag
    # After the release notes: a release with no user-facing change stops before anything is tagged.
    needs: [compute-version, release-notes]
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Push annotated tag
        env:
          NEW_TAG: ${{ needs.compute-version.outputs.tag }}
          NEW_VERSION: ${{ needs.compute-version.outputs.version }}
          # GITHUB_TOKEN tag pushes don't re-trigger push.tags workflows, but the
          # build + release jobs below run directly in this same workflow run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "## 🧪 Dry run: ${NEW_TAG} would be tagged (no tag pushed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "${NEW_TAG}"

          {
            echo "## 🏷️ Tagged ${NEW_TAG}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${NEW_VERSION}\` |"
            echo "| Tag | \`${NEW_TAG}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────
  # Windows x64 — Velopack portable ZIP + InnoSetup installer of that layout
  # ──────────────────────────────────────────────────────────────────
  build-windows:
    needs: [compute-version, tag, release-notes]
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download release notes
        uses: actions/download-artifact@v8.0.1
        with:
          name: app-release-notes
          path: release-notes-app

      - name: Publish win-x64
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:PublishReadyToRun=true
          -p:PublishTrimmed=false
          -p:Version=${{ needs.compute-version.outputs.version }}
          -p:AssemblyVersion=${{ needs.compute-version.outputs.version }}
          -p:FileVersion=${{ needs.compute-version.outputs.version }}
          -p:RentierUpdateFeedUrl=${{ env.REPO_URL }}
          -p:RentierReleaseNotesPath=${{ github.workspace }}/release-notes-app/release-notes.md
          -o ./publish/win-x64

      - name: Restore .NET tools (vpk)
        run: dotnet tool restore

      - name: Download previous Velopack release (delta base)
        # The previous release's full package lets vpk build a small delta update. The first
        # release that carries a Velopack feed has no predecessor, so this fails exactly once.
        continue-on-error: true
        shell: pwsh
        run: dotnet vpk download github --repoUrl "${{ env.REPO_URL }}" --channel win-x64 -o velopack --token "${{ github.token }}" -x

      - name: Pack Velopack release
        shell: pwsh
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        # --noInst is required: Velopack's own Setup.exe installs to %LocalAppData%\<packId>,
        # which for "Rentier" is the user data folder, and it replaces that folder on install.
        # The portable layout is shipped inside InnoSetup instead, which installs it to
        # %LocalAppData%\Programs\Rentier (the install folder, never the data folder).
        run: >
          dotnet vpk pack
          --packId $env:PACK_ID --packTitle Rentier --packAuthors Rentier
          --packVersion $env:VERSION --packDir publish/win-x64 --runtime win-x64
          --channel win-x64 -o velopack
          --mainExe Rentier.Desktop.exe --icon Assets/Icons/rentier.ico
          --releaseNotes release-notes-app/release-notes.md
          --noInst -x

      - name: Collect Velopack feed and portable layout
        shell: pwsh
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          # assets.<channel>.json lists exactly the files this pack created, so the downloaded
          # previous-release package is never re-published.
          $assets = Get-Content velopack/assets.win-x64.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force feed-out | Out-Null
          $assets | Where-Object { $_.Type -in 'Full', 'Delta' } |
            ForEach-Object { Copy-Item "velopack/$($_.RelativeFileName)" feed-out/ }
          Copy-Item velopack/releases.win-x64.json feed-out/

          $portable = ($assets | Where-Object Type -eq 'Portable').RelativeFileName
          if (-not $portable) { throw "vpk produced no portable package" }
          Copy-Item "velopack/$portable" "Rentier-$env:VERSION-win-x64.zip"
          Expand-Archive "velopack/$portable" -DestinationPath publish/win-x64-velopack -Force

      - name: Build InnoSetup installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "InnoSetup not found, installing via Chocolatey..."
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc `
            /DAppVersion=${{ needs.compute-version.outputs.version }} `
            /DSourcePath="$PWD\publish\win-x64-velopack" `
            /DOutputPath="$PWD" `
            /DIconPath="$PWD\Assets\Icons\rentier.ico" `
            .github\installers\rentier-setup.iss

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-win-x64
          path: |
            Rentier-*-win-x64.zip
            Rentier-*-win-x64-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: feed-win-x64
          path: feed-out/*
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # macOS — Velopack's self-updating Rentier.app in a .dmg  (x64 and ARM64)
  # R2R intentionally excluded: not beneficial for Avalonia on macOS.
  # ──────────────────────────────────────────────────────────────────
  build-macos:
    needs: [compute-version, tag, release-notes]
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download release notes
        uses: actions/download-artifact@v8.0.1
        with:
          name: app-release-notes
          path: release-notes-app

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:PublishTrimmed=false
          -p:Version=${{ needs.compute-version.outputs.version }}
          -p:AssemblyVersion=${{ needs.compute-version.outputs.version }}
          -p:FileVersion=${{ needs.compute-version.outputs.version }}
          -p:RentierUpdateFeedUrl=${{ env.REPO_URL }}
          -p:RentierReleaseNotesPath=${{ github.workspace }}/release-notes-app/release-notes.md
          -o ./publish/${{ matrix.rid }}

      - name: Restore .NET tools (vpk)
        run: dotnet tool restore

      - name: Download previous Velopack release (delta base)
        # Fails exactly once: the first release with a Velopack feed has no predecessor.
        continue-on-error: true
        run: dotnet vpk download github --repoUrl "${REPO_URL}" --channel "${{ matrix.rid }}" -o velopack --token "${{ github.token }}" -x

      - name: Pack Velopack release
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
          RID: ${{ matrix.rid }}
        # vpk builds its own self-updating Rentier.app (Info.plist included). Its .pkg installer
        # is not published — the DMG below remains the macOS download.
        run: >
          dotnet vpk pack
          --packId "${PACK_ID}" --packTitle Rentier --packAuthors Rentier
          --packVersion "${VERSION}" --packDir "publish/${RID}" --runtime "${RID}"
          --channel "${RID}" -o velopack
          --mainExe Rentier.Desktop --icon Assets/Icons/rentier.icns
          --releaseNotes release-notes-app/release-notes.md
          --bundleId com.rentier.desktop -x

      - name: Collect Velopack feed and build DMG
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          brew install create-dmg

          # assets.<channel>.json lists exactly the files this pack created.
          ASSETS="velopack/assets.${RID}.json"
          mkdir -p feed-out velopack-dmg
          jq -r '.[] | select(.Type == "Full" or .Type == "Delta") | .RelativeFileName' "$ASSETS" \
            | while read -r f; do cp "velopack/$f" feed-out/; done
          cp "velopack/releases.${RID}.json" feed-out/

          PORTABLE=$(jq -r '.[] | select(.Type == "Portable") | .RelativeFileName' "$ASSETS")
          [ -n "$PORTABLE" ] || { echo "::error::vpk produced no portable package"; exit 1; }
          ditto -x -k "velopack/${PORTABLE}" velopack-dmg
          [ -d velopack-dmg/Rentier.app ] || { echo "::error::Rentier.app missing from ${PORTABLE}"; exit 1; }

          # create-dmg returns exit code 2 when it skips setting a background
          # image (which is fine). Treat only real failures as errors.
          create-dmg \
            --volname "Rentier" \
            --volicon "Assets/Icons/rentier.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Rentier.app" 175 190 \
            --hide-extension "Rentier.app" \
            --app-drop-link 425 190 \
            "Rentier-${VERSION}-${RID}.dmg" \
            velopack-dmg || true

          if [ ! -f "Rentier-${VERSION}-${RID}.dmg" ]; then
            echo "::error::DMG creation failed for ${RID}"
            exit 1
          fi

      - name: Smoke test the macOS app
        env:
          RID: ${{ matrix.rid }}
        run: |
          # The DMG holds this same Rentier.app, and it is the only macOS download: run it before
          # release. --smoke-test-update fails unless Velopack accepts the bundle as installed.
          # macos-latest is Apple silicon, so the osx-x64 app runs under Rosetta 2.
          if [ "$RID" = "osx-x64" ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

          APP=velopack-dmg/Rentier.app
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP}/Contents/Info.plist")
          BIN="${APP}/Contents/MacOS/${EXE}"
          [ -x "$BIN" ] || { echo "::error::${BIN} is missing or not executable"; exit 1; }

          for arg in --smoke-test --smoke-test-update; do
            "$BIN" "$arg" || { echo "::error::${RID} Rentier.app: ${arg} failed"; exit 1; }
          done
          echo "MACOS SMOKE TEST PASSED (${RID})"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.rid }}
          path: Rentier-*-${{ matrix.rid }}.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: feed-${{ matrix.rid }}
          path: feed-out/*
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Linux x64 — Velopack AppImage
  # R2R intentionally excluded: not beneficial for Avalonia on Linux.
  # ──────────────────────────────────────────────────────────────────
  build-linux:
    needs: [compute-version, tag, release-notes]
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download release notes
        uses: actions/download-artifact@v8.0.1
        with:
          name: app-release-notes
          path: release-notes-app

      - name: Publish linux-x64
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:PublishTrimmed=false
          -p:Version=${{ needs.compute-version.outputs.version }}
          -p:AssemblyVersion=${{ needs.compute-version.outputs.version }}
          -p:FileVersion=${{ needs.compute-version.outputs.version }}
          -p:RentierUpdateFeedUrl=${{ env.REPO_URL }}
          -p:RentierReleaseNotesPath=${{ github.workspace }}/release-notes-app/release-notes.md
          -o ./publish/linux-x64

      # The AppImage is the only Linux package: a .deb would install root-owned files under
      # /usr/lib, which the app cannot replace, so it could never update itself.
      - name: Restore .NET tools (vpk)
        run: dotnet tool restore

      - name: Download previous Velopack release (delta base)
        # Fails exactly once: the first release with a Velopack feed has no predecessor.
        continue-on-error: true
        run: dotnet vpk download github --repoUrl "${REPO_URL}" --channel linux-x64 -o velopack --token "${{ github.token }}" -x

      - name: Pack Velopack release
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: >
          dotnet vpk pack
          --packId "${PACK_ID}" --packTitle Rentier --packAuthors Rentier
          --packVersion "${VERSION}" --packDir publish/linux-x64 --runtime linux-x64
          --channel linux-x64 -o velopack
          --mainExe Rentier.Desktop --icon Assets/Icons/png/rentier_256x256.png
          --releaseNotes release-notes-app/release-notes.md
          --categories Office -x

      - name: Collect Velopack feed and AppImage
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          # assets.<channel>.json lists exactly the files this pack created.
          ASSETS=velopack/assets.linux-x64.json
          mkdir -p feed-out
          jq -r '.[] | select(.Type == "Full" or .Type == "Delta") | .RelativeFileName' "$ASSETS" \
            | while read -r f; do cp "velopack/$f" feed-out/; done
          cp velopack/releases.linux-x64.json feed-out/

          APPIMAGE=$(jq -r '.[] | .RelativeFileName | select(endswith(".AppImage"))' "$ASSETS")
          [ -n "$APPIMAGE" ] || { echo "::error::vpk produced no AppImage"; exit 1; }
          cp "velopack/${APPIMAGE}" "Rentier-${VERSION}-linux-x64.AppImage"

      - name: Smoke test the AppImage
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          # The AppImage is the only Linux download: run it before release, through its own
          # entry point, so Velopack sees what a user's copy sees. APPIMAGE_EXTRACT_AND_RUN=1
          # runs it without FUSE. --smoke-test-update fails unless Velopack accepts it as installed.
          APP="./Rentier-${VERSION}-linux-x64.AppImage"
          chmod +x "$APP"
          for arg in --smoke-test --smoke-test-update; do
            APPIMAGE_EXTRACT_AND_RUN=1 "$APP" "$arg" || { echo "::error::AppImage ${arg} failed"; exit 1; }
          done
          echo "APPIMAGE SMOKE TEST PASSED"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-linux-x64
          path: Rentier-*-linux-x64.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: feed-linux-x64
          path: feed-out/*
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Windows artifact smoke test — validates the portable ZIP and the installer before
  # publishing the GitHub Release.
  # ──────────────────────────────────────────────────────────────────
  smoke-test-windows:
    name: Windows Artifact Smoke Test
    needs: [compute-version, build-windows]
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-win-x64
          path: ./artifact

      - name: Validate portable ZIP layout and smoke test it
        shell: pwsh
        run: |
          $zip = Get-ChildItem ./artifact -Filter "Rentier-*-win-x64.zip" -Recurse |
            Select-Object -First 1
          if (-not $zip) { throw "Win-x64 ZIP not found in downloaded artifact" }
          Expand-Archive -Path $zip.FullName -DestinationPath ./velopack-extracted -Force

          # Without Update.exe + current\ next to the launcher, Velopack reports the app as not
          # installed and the in-app updater silently does nothing.
          foreach ($f in 'Rentier.exe', 'Update.exe', 'current\Rentier.Desktop.exe', 'current\sq.version') {
            if (-not (Test-Path "./velopack-extracted/$f")) { throw "Velopack layout is missing $f" }
          }

          $proc = Start-Process ./velopack-extracted/current/Rentier.Desktop.exe `
            -ArgumentList "--smoke-test" -PassThru -Wait -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "Smoke test exited with code $($proc.ExitCode) — artifact is not functional"
          }

          # --smoke-test exits before Velopack starts, so it cannot see whether Velopack accepts
          # this layout. --smoke-test-update runs after VelopackApp.Run() and fails when the app
          # would report "not installed" (every update check skipped, nothing logged to the user).
          $proc = Start-Process ./velopack-extracted/current/Rentier.Desktop.exe `
            -ArgumentList "--smoke-test-update" -PassThru -Wait -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "Update smoke test exited with code $($proc.ExitCode) — the installed app would never update"
          }
          Write-Host "PORTABLE ZIP SMOKE TEST PASSED (exit code 0)"

      - name: Install, smoke test and uninstall the installer
        shell: pwsh
        run: |
          # setup.exe is the main Windows download: install it per-user (silently, into a temp
          # folder), check that Velopack accepts the installed layout and that the Rentier.exe
          # launcher (what the shortcuts start) runs the app, then uninstall it and check that the
          # user data folder and its files survived.
          $setup = Get-ChildItem ./artifact -Filter "Rentier-*-win-x64-setup.exe" -Recurse |
            Select-Object -First 1
          if (-not $setup) { throw "Win-x64 installer not found in downloaded artifact" }

          $dir = Join-Path $env:RUNNER_TEMP 'rentier-install'
          $log = Join-Path $env:RUNNER_TEMP 'rentier-setup.log'
          $proc = Start-Process $setup.FullName -PassThru -Wait `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"", "/LOG=`"$log`""
          if ($proc.ExitCode -ne 0) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "Installer exited with code $($proc.ExitCode)"
          }

          foreach ($f in 'Rentier.exe', 'Update.exe', 'current\Rentier.Desktop.exe', 'current\sq.version', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Installed layout is missing $f" }
          }

          # The portable ZIP step above already created the user data folder. Start from none, so
          # the checks below see what the installed copy does.
          $data = Join-Path $env:LOCALAPPDATA 'Rentier'
          $smokeDb = Join-Path $data 'rentier-smoke.db'
          Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue

          $exe = Join-Path $dir 'current\Rentier.Desktop.exe'
          foreach ($arg in '--smoke-test', '--smoke-test-update') {
            $proc = Start-Process $exe -ArgumentList $arg -PassThru -Wait -NoNewWindow
            if ($proc.ExitCode -ne 0) { throw "Installed app: $arg exited with code $($proc.ExitCode)" }
          }
          if (-not (Test-Path $smokeDb)) { throw "The installed app's --smoke-test did not create $smokeDb" }

          # The shortcuts start Rentier.exe, Velopack's launcher, not the app itself. It starts
          # current\Rentier.Desktop.exe with the same arguments and exits without waiting, so its
          # exit code says nothing about the app: check that the app ran (the smoke database is
          # created again) and has exited.
          Remove-Item $smokeDb -Force
          $proc = Start-Process (Join-Path $dir 'Rentier.exe') -ArgumentList '--smoke-test' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Launcher Rentier.exe exited with code $($proc.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(120)
          while (-not (Test-Path $smokeDb) -or (Get-Process -Name 'Rentier.Desktop' -ErrorAction SilentlyContinue)) {
            if ((Get-Date) -gt $deadline) { throw "Rentier.exe did not start the app (no $smokeDb, or the app never exited)" }
            Start-Sleep -Seconds 2
          }

          # Uninstalling must leave the user data folder and every file in it alone, not just
          # the folder itself.
          $sentinel = Join-Path $data 'uninstall-must-keep-this.txt'
          Set-Content -Path $sentinel -Value 'user data'

          $proc = Start-Process (Join-Path $dir 'unins000.exe') -PassThru -Wait `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($proc.ExitCode -ne 0) { throw "Uninstaller exited with code $($proc.ExitCode)" }
          # The uninstaller hands over to a temporary copy of itself, so wait for the files to go.
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path (Join-Path $dir 'Rentier.exe')) -or (Test-Path (Join-Path $dir 'current'))) {
            if ((Get-Date) -gt $deadline) { throw "Uninstall did not remove the installed files" }
            Start-Sleep -Seconds 2
          }
          foreach ($f in $sentinel, $smokeDb) {
            if (-not (Test-Path $f)) { throw "Uninstall deleted user data: $f" }
          }
          Write-Host "INSTALLER SMOKE TEST PASSED"

  # ──────────────────────────────────────────────────────────────────
  # Create GitHub Release with all artifacts + checksums
  # ──────────────────────────────────────────────────────────────────
  release:
    needs: [compute-version, tag, release-notes, build-windows, build-macos, build-linux, smoke-test-windows]
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create GitHub Release + upload release assets
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Download Velopack feeds
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: feed-*
          path: feeds

      - name: Merge Velopack feeds into dist (fail on any name collision)
        run: |
          # Each channel's files must have unique names: in one GitHub release a duplicate
          # would silently replace another channel's package.
          for f in feeds/*/*; do
            name=$(basename "$f")
            if [ -e "dist/$name" ]; then
              echo "::error::Release asset name collision: $name"
              exit 1
            fi
            cp "$f" dist/
          done

      - name: Verify all platform artifacts present
        working-directory: dist
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          expected=(
            "Rentier-${VERSION}-win-x64.zip"
            "Rentier-${VERSION}-win-x64-setup.exe"
            "Rentier-${VERSION}-osx-arm64.dmg"
            "Rentier-${VERSION}-osx-x64.dmg"
            "Rentier-${VERSION}-linux-x64.AppImage"
          )
          missing=0
          for f in "${expected[@]}"; do
            [ -f "$f" ] || { echo "::error::Expected release artifact missing: $f"; missing=1; }
          done
          [ "$missing" -eq 0 ] || { echo "::error::Aborting release — missing artifact(s) above."; exit 1; }
          echo "All ${#expected[@]} platform artifacts present."

      - name: Download release notes
        uses: actions/download-artifact@v8.0.1
        with:
          name: app-release-notes
          path: release-notes-app

      - name: Verify Velopack update feeds
        working-directory: dist
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          # The installed app finds updates only through releases.<channel>.json; a release
          # without a valid feed is exactly the silent failure this pipeline used to ship.
          failed=0
          for ch in win-x64 osx-arm64 osx-x64 linux-x64; do
            feed="releases.${ch}.json"
            if [ ! -f "$feed" ]; then
              echo "::error::Missing update feed: $feed"; failed=1; continue
            fi
            pkg=$(jq -r --arg v "$VERSION" \
              '.Assets[] | select(.Version == $v and .Type == "Full") | .FileName' "$feed")
            if [ -z "$pkg" ]; then
              echo "::error::$feed has no Full package for ${VERSION}"; failed=1
            elif [ ! -f "$pkg" ]; then
              echo "::error::$feed references $pkg, which is not in the release"; failed=1
            elif [ -s ../release-notes-app/release-notes.md ] && [ -z "$(jq -r --arg v "$VERSION" \
                '.Assets[] | select(.Version == $v and .Type == "Full") | .NotesMarkdown // ""' "$feed")" ]; then
              # The app's "What's new" on the update bar reads these notes from the feed.
              echo "::error::$feed has no release notes for ${VERSION} (vpk pack --releaseNotes)"; failed=1
            else
              echo "${ch}: ${pkg}"
            fi
          done
          [ "$failed" -eq 0 ] || { echo "::error::Aborting release — invalid update feed(s) above."; exit 1; }

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum Rentier-* releases.*.json | tee SHA256SUMS.txt

      - name: Generate release notes
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
          TAG: ${{ needs.compute-version.outputs.tag }}
          # From compute-version, not "second-newest tag": a dry run pushes no new tag, so the
          # newest tag is then the previous release.
          PREV_TAG: ${{ needs.compute-version.outputs.prev_tag }}
        run: |
          {

            if [ -n "$PREV_TAG" ]; then
              echo "## What's Changed since ${PREV_TAG}"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            else
              echo "## 🎉 Initial Release"
              echo ""
              git log --pretty=format:"- %s (%h)" --no-merges -20
            fi

            echo ""
            echo ""
            echo "## Download"
            echo ""
            echo "Every package updates itself: Rentier checks for a new version when it starts and offers to install it."
            echo ""
            echo "| Platform | Installer | Portable |"
            echo "|----------|-----------|----------|"
            echo "| Windows x64 | \`Rentier-${VERSION}-win-x64-setup.exe\` | \`Rentier-${VERSION}-win-x64.zip\` |"
            echo "| macOS Apple silicon | \`Rentier-${VERSION}-osx-arm64.dmg\` | — |"
            echo "| macOS Intel | \`Rentier-${VERSION}-osx-x64.dmg\` | — |"
            echo "| Linux x64 | — | \`Rentier-${VERSION}-linux-x64.AppImage\` (\`chmod +x\`; may need \`libfuse2\`; needs ICU, \`libicu\`) |"
            echo ""
            echo "### Switching from a package that does not update itself"
            echo ""
            echo "Packages of v1.3.0 and earlier, and the v1.3.1 packages without \`-velopack\` in their name, cannot update themselves. Switch once; after that Rentier updates from inside the app. (Installed v1.3.1 from a \`-velopack\` package? Then there is nothing to do.) Your data stays in your user profile and is not affected."
            echo ""
            echo "- **Windows:** run \`Rentier-${VERSION}-win-x64-setup.exe\`. An install made for your account is upgraded in place. If Rentier was installed for all users, the installer says so: uninstall it in Settings > Apps first, then run the installer again. Using the portable ZIP? Extract the new ZIP into a new, empty folder, start \`Rentier.exe\`, and delete the old folder."
            echo "- **macOS:** open the DMG and drag \`Rentier.app\` into Applications, replacing the old one."
            echo "- **Linux:** use the AppImage instead of the \`.deb\` or \`.tar.gz\`. If you installed the \`.deb\`, remove it with \`sudo apt remove rentier\`."
            echo ""
            echo "## Checksums (SHA256)"
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

          cat release-notes.md

      - name: Upload release preview (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-preview-${{ needs.compute-version.outputs.version }}
          path: |
            dist/Rentier-*
            dist/releases.*.json
            dist/SHA256SUMS.txt
            release-notes.md
            release-notes-app/release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Summarize release preview (dry run)
        if: ${{ inputs.dry_run }}
        working-directory: dist
        env:
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          {
            echo "## 🧪 Dry run: ${TAG} was NOT released"
            echo ""
            echo "Download the \`release-preview-*\` artifact of this run to inspect the files."
            echo ""
            echo "| Asset | Size |"
            echo "|-------|------|"
            for f in Rentier-* releases.*.json SHA256SUMS.txt; do
              echo "| \`${f}\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.compute-version.outputs.tag }}
          name: Rentier ${{ needs.compute-version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/Rentier-*
            dist/releases.*.json
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
