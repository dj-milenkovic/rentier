version: 2

updates:
  # ── NuGet (Central Package Management via Directory.Packages.props) ──────────
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Belgrade"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # "chore(deps):" satisfies the PR-title linter's Conventional Commits pattern.
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # ── Version-locked families ─────────────────────────────────────────────
      # These ship as matched sets: bumping one member without the others produces
      # a PR that cannot build. ReactiveUI.Avalonia[.Reactive] is compiled against
      # an exact ReactiveUI version and pins an exact Avalonia version, so the whole
      # UI stack has to move as one unit. No `update-types` filter, so majors group
      # here too instead of splitting into single-package PRs.
      avalonia-reactiveui:
        patterns:
          - "Avalonia*"
          - "ReactiveUI*"

      entity-framework-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"

      # Test stack: FsCheck.Xunit.v3 >= 3.4 requires xunit.v3 4.x core, and the
      # Microsoft Testing Platform / coverlet packages must match the xunit runner.
      xunit:
        patterns:
          - "xunit*"
          - "FsCheck.Xunit*"
          - "coverlet*"
          - "Microsoft.Testing.*"
          - "Microsoft.NET.Test.Sdk"

      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions*"

      # Minor and patch updates ship together in a single PR — less noise.
      # Major updates outside the families above still get their own PRs.
      # The families are excluded explicitly so a package never lands in two
      # PRs at once (previously Avalonia/ReactiveUI bumps showed up both in
      # their family PR and here, e.g. #144 vs #149/#152).
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "Avalonia*"
          - "ReactiveUI*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions*"
          - "xunit*"
          - "FsCheck.Xunit*"
          - "coverlet*"
          - "Microsoft.Testing.*"
          - "Microsoft.NET.Test.Sdk"

  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Belgrade"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # "ci(deps):" satisfies the PR-title linter.
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
