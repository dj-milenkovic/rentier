name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.2.3)'
        required: true
        type: string
      enable_trimming:
        description: 'Enable PublishTrimmed (may break reflection-heavy code)'
        required: false
        type: boolean
        default: false
  # Called by auto-release.yml after a PR is merged to main.
  workflow_call:
    inputs:
      version:
        description: 'Version number (e.g., 1.2.3)'
        required: true
        type: string
      enable_trimming:
        description: 'Enable PublishTrimmed (may break reflection-heavy code)'
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.x'
  PROJECT_PATH: src/Rentier.Desktop/Rentier.Desktop.csproj
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Resolve version from tag or manual input
  # ──────────────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # git tag + push on workflow_dispatch path; read is enough for workflow_call
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      trimmed: ${{ steps.v.outputs.trimmed }}
    steps:
      - uses: actions/checkout@v6.0.3
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0

      - name: Determine version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TRIMMED: ${{ inputs.enable_trimming }}
        run: |
          # Use the provided input version when available (workflow_dispatch or workflow_call).
          # NOTE: github.event_name inside a reusable workflow reflects the *outer* triggering
          # event (e.g. "push"), not "workflow_call", so we key off INPUT_VERSION instead.
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
            # Normalise: anything other than explicit "true" becomes "false"
            [ "${INPUT_TRIMMED}" = "true" ] && TRIMMED="true" || TRIMMED="false"
          else
            # push.tags trigger — strip the leading 'v'
            VERSION="${GITHUB_REF#refs/tags/v}"
            TRIMMED="false"
          fi
          # Guard against shell injection: version must be pure semver
          if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format '${VERSION}'. Expected X.Y.Z (digits only)."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "trimmed=${TRIMMED}" >> "$GITHUB_OUTPUT"
          echo "### 🏷️ Version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Push annotated tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          NEW_TAG: ${{ steps.v.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Skip if tag already exists (idempotent re-runs)
          if git ls-remote --tags origin "${NEW_TAG}" | grep -q "${NEW_TAG}"; then
            echo "Tag ${NEW_TAG} already exists — skipping push."
          else
            git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
            git push origin "${NEW_TAG}"
          fi

  # ──────────────────────────────────────────────────────────────────
  # Windows x64 — ZIP + InnoSetup installer
  # ──────────────────────────────────────────────────────────────────
  build-windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish win-x64
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:PublishReadyToRun=true
          -p:PublishTrimmed=${{ needs.version.outputs.trimmed }}
          -p:Version=${{ needs.version.outputs.version }}
          -p:AssemblyVersion=${{ needs.version.outputs.version }}
          -p:FileVersion=${{ needs.version.outputs.version }}
          -o ./publish/win-x64

      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path ./publish/win-x64/* -DestinationPath "./Rentier-${{ needs.version.outputs.version }}-win-x64.zip"

      - name: Build InnoSetup installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "InnoSetup not found, installing via Chocolatey..."
            choco install innosetup -y --no-progress | Out-Null
          }
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          & $iscc `
            /DAppVersion=${{ needs.version.outputs.version }} `
            /DSourcePath="$PWD\publish\win-x64" `
            /DOutputPath="$PWD\artifacts" `
            /DIconPath="$PWD\Assets\Icons\rentier.ico" `
            .github\installers\rentier-setup.iss

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-win-x64
          path: |
            Rentier-*-win-x64.zip
            artifacts/Rentier-*-win-x64-setup.exe
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # macOS — .app bundle + .dmg  (x64 and ARM64)
  # R2R intentionally excluded: not beneficial for Avalonia on macOS.
  # ──────────────────────────────────────────────────────────────────
  build-macos:
    needs: version
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:PublishTrimmed=${{ needs.version.outputs.trimmed }}
          -p:Version=${{ needs.version.outputs.version }}
          -p:AssemblyVersion=${{ needs.version.outputs.version }}
          -p:FileVersion=${{ needs.version.outputs.version }}
          -o ./publish/${{ matrix.rid }}

      - name: Create .app bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          APP="Rentier.app"
          mkdir -p "${APP}/Contents/MacOS"
          mkdir -p "${APP}/Contents/Resources"

          cp -R publish/${RID}/* "${APP}/Contents/MacOS/"
          cp Assets/Icons/rentier.icns "${APP}/Contents/Resources/"
          chmod +x "${APP}/Contents/MacOS/Rentier.Desktop"

          cat > "${APP}/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Rentier</string>
            <key>CFBundleDisplayName</key>
            <string>Rentier</string>
            <key>CFBundleIdentifier</key>
            <string>com.rentier.desktop</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>Rentier.Desktop</string>
            <key>CFBundleIconFile</key>
            <string>rentier</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
          </dict>
          </plist>
          PLIST

      - name: Create DMG
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          brew install create-dmg

          # create-dmg returns exit code 2 when it skips setting a background
          # image (which is fine). Treat only real failures as errors.
          create-dmg \
            --volname "Rentier" \
            --volicon "Assets/Icons/rentier.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Rentier.app" 175 190 \
            --hide-extension "Rentier.app" \
            --app-drop-link 425 190 \
            "Rentier-${VERSION}-${RID}.dmg" \
            "Rentier.app" || true

          if [ ! -f "Rentier-${VERSION}-${RID}.dmg" ]; then
            echo "::error::DMG creation failed for ${RID}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.rid }}
          path: Rentier-*-${{ matrix.rid }}.dmg
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Linux x64 — tar.gz + .deb
  # R2R intentionally excluded: not beneficial for Avalonia on Linux.
  # ──────────────────────────────────────────────────────────────────
  build-linux:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish linux-x64
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:PublishTrimmed=${{ needs.version.outputs.trimmed }}
          -p:Version=${{ needs.version.outputs.version }}
          -p:AssemblyVersion=${{ needs.version.outputs.version }}
          -p:FileVersion=${{ needs.version.outputs.version }}
          -o ./publish/linux-x64

      - name: Create tar.gz
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd publish/linux-x64
          tar -czf "../../Rentier-${VERSION}-linux-x64.tar.gz" ./*

      - name: Create .deb package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          PKG="rentier_${VERSION}_amd64"

          mkdir -p "${PKG}/DEBIAN"
          mkdir -p "${PKG}/usr/lib/rentier"
          mkdir -p "${PKG}/usr/bin"
          mkdir -p "${PKG}/usr/share/applications"
          mkdir -p "${PKG}/usr/share/icons/hicolor/256x256/apps"

          # Copy published binary (single-file)
          cp publish/linux-x64/Rentier.Desktop "${PKG}/usr/lib/rentier/"
          chmod 755 "${PKG}/usr/lib/rentier/Rentier.Desktop"

          # Launcher symlink
          ln -s /usr/lib/rentier/Rentier.Desktop "${PKG}/usr/bin/rentier"

          # Icon
          cp Assets/Icons/png/rentier_256x256.png \
             "${PKG}/usr/share/icons/hicolor/256x256/apps/rentier.png"

          # Desktop entry
          cat > "${PKG}/usr/share/applications/rentier.desktop" << 'EOF'
          [Desktop Entry]
          Name=Rentier
          Comment=PP-OPO Tax Filing Assistant
          Exec=/usr/bin/rentier
          Icon=rentier
          Terminal=false
          Type=Application
          Categories=Finance;Office;
          EOF

          # Control file
          INSTALLED_SIZE=$(du -sk "${PKG}/usr" | cut -f1)
          cat > "${PKG}/DEBIAN/control" << EOF
          Package: rentier
          Version: ${VERSION}
          Section: finance
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_SIZE}
          Depends: libicu-dev
          Maintainer: Rentier <noreply@rentier.app>
          Description: Automated Serbian PP-OPO passive income tax filing
           Rentier automates the process of filing PP-OPO passive income
           tax returns for Serbian tax residents with foreign income.
          EOF

          dpkg-deb --build --root-owner-group "${PKG}"
          mv "${PKG}.deb" "Rentier-${VERSION}-linux-x64.deb"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-linux-x64
          path: |
            Rentier-*-linux-x64.tar.gz
            Rentier-*-linux-x64.deb
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Windows artifact smoke test — validates the built EXE is functional
  # before publishing the GitHub Release.
  # ──────────────────────────────────────────────────────────────────
  smoke-test-windows:
    name: Windows Artifact Smoke Test
    needs: [version, build-windows]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-win-x64
          path: ./artifact

      - name: Validate artifact structure
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $zip = Get-ChildItem ./artifact -Filter "Rentier-*-win-x64.zip" -Recurse |
            Select-Object -First 1
          if (-not $zip) { throw "Win-x64 ZIP not found in downloaded artifact" }

          Expand-Archive -Path $zip.FullName -DestinationPath ./extracted -Force

          $exe = Get-ChildItem ./extracted -Filter "Rentier.Desktop.exe" -Recurse |
            Select-Object -First 1
          if (-not $exe) { throw "Rentier.Desktop.exe missing from ZIP" }

          Write-Host "Artifact structure OK: single-file EXE present (native libs bundled inside)"
          "EXE_PATH=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV

      - name: Headless launch smoke test
        shell: pwsh
        run: |
          $proc = Start-Process $env:EXE_PATH `
            -ArgumentList "--smoke-test" -PassThru -Wait -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "Smoke test exited with code $($proc.ExitCode) — artifact is not functional"
          }
          Write-Host "SMOKE TEST PASSED (exit code 0)"

  # ──────────────────────────────────────────────────────────────────
  # Create GitHub Release with all artifacts + checksums
  # ──────────────────────────────────────────────────────────────────
  release:
    needs: [version, build-windows, build-macos, build-linux, smoke-test-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create GitHub Release + upload release assets
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum Rentier-* | tee SHA256SUMS.txt

      - name: Generate release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          {
            PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p' || true)

            if [ -n "$PREV_TAG" ]; then
              echo "## What's Changed since ${PREV_TAG}"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            else
              echo "## 🎉 Initial Release"
              echo ""
              git log --pretty=format:"- %s (%h)" --no-merges -20
            fi

            echo ""
            echo ""
            echo "## Download"
            echo ""
            echo "| Platform | Installer | Portable |"
            echo "|----------|-----------|----------|"
            echo "| Windows x64 | \`Rentier-${VERSION}-win-x64-setup.exe\` | \`Rentier-${VERSION}-win-x64.zip\` |"
            echo "| macOS ARM64 | \`Rentier-${VERSION}-osx-arm64.dmg\` | — |"
            echo "| macOS x64 | \`Rentier-${VERSION}-osx-x64.dmg\` | — |"
            echo "| Linux x64 | \`Rentier-${VERSION}-linux-x64.deb\` | \`Rentier-${VERSION}-linux-x64.tar.gz\` |"
            echo ""
            echo "## Checksums (SHA256)"
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Rentier ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/Rentier-*
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}