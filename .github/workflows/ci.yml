name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ──────────────────────────────────────────────
  # Format & vulnerability checks (fast-fail)
  # ──────────────────────────────────────────────
  lint:
    name: Format & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rentier.slnx

      - name: Check formatting
        run: dotnet format Rentier.slnx --no-restore --verify-no-changes

      - name: Check vulnerable packages
        run: dotnet list Rentier.slnx package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt && ! grep -qi "has the following vulnerable packages" vuln-report.txt

  # ──────────────────────────────────────────────
  # Migration tests (fast-fail gate, Ubuntu only)
  # ──────────────────────────────────────────────
  migration-tests:
    name: Migration Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/Rentier.Infrastructure.Tests/Rentier.Infrastructure.Tests.csproj

      - name: Build
        run: dotnet build tests/Rentier.Infrastructure.Tests --no-restore -c Release

      - name: Run migration tests
        run: |
          dotnet test tests/Rentier.Infrastructure.Tests \
            --no-build -c Release \
            --filter "FullyQualifiedName~Migration|FullyQualifiedName~DatabaseInitializer" \
            --logger "console;verbosity=normal"

  # ──────────────────────────────────────────────
  # Integration & Scenario tests (Ubuntu only)
  # ──────────────────────────────────────────────
  integration-tests:
    name: Integration & Scenario Tests
    needs: [lint, migration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rentier.slnx

      - name: Build
        run: |
          dotnet build tests/Rentier.Infrastructure.Tests --no-restore -c Release
          dotnet build tests/Rentier.Scenarios.Tests --no-restore -c Release

      - name: Run integration tests
        run: |
          dotnet test tests/Rentier.Infrastructure.Tests \
            --no-build -c Release \
            --filter "Category=Integration" \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./coverage-integration \
            --logger "trx;LogFileName=infra-results.trx" \
            --logger "console;verbosity=normal"
          dotnet test tests/Rentier.Scenarios.Tests \
            --no-build -c Release \
            --filter "Category=Integration" \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./coverage-integration \
            --logger "trx;LogFileName=scenarios-results.trx" \
            --logger "console;verbosity=normal"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-integration
          path: ./coverage-integration/**/coverage.opencover.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-test-results
          path: ./coverage-integration/**/*.trx

  # ──────────────────────────────────────────────
  # Build & Test matrix (Windows, macOS, Ubuntu)
  # ──────────────────────────────────────────────
  build:
    name: Build & Test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            is-windows: true
          - os: macos-latest
            is-windows: false
          - os: ubuntu-latest
            is-windows: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0  # full history for SonarCloud

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # ── Build ────────────────────────────────
      - name: Restore (all projects)
        run: dotnet restore Rentier.slnx

      - name: Build (all projects)
        run: dotnet build Rentier.slnx --no-restore -c Release

      # ── Test ─────────────────────────────────
      - name: Test
        shell: bash
        run: |
          dotnet test Rentier.slnx --no-build -c Release \
            --filter "Category!=Integration" \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./coverage \
            --logger "trx;LogFileName=results-${{ matrix.os }}.trx" \
            --logger "console;verbosity=normal"
     
      # ── Artifacts ────────────────────────────
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: ./coverage/**/coverage.opencover.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: ./coverage/**/*.trx

      # ── Step summary ─────────────────────────
      - name: Post summary
        if: always()
        shell: bash
        run: |
          echo "## 🧪 Test Results — ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Count tests from TRX files
          total=0; passed=0; failed=0
          for trx in $(find ./coverage -name '*.trx' 2>/dev/null); do
            t=$(grep -Eo 'total="[0-9]+' "$trx" | cut -d'"' -f2 | head -1)
            p=$(grep -Eo 'passed="[0-9]+' "$trx" | cut -d'"' -f2 | head -1)
            f=$(grep -Eo 'failed="[0-9]+' "$trx" | cut -d'"' -f2 | head -1)
            total=$((total + ${t:-0}))
            passed=$((passed + ${p:-0}))
            failed=$((failed + ${f:-0}))
          done

          if [ "$failed" -gt 0 ]; then
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Total  | $total |" >> "$GITHUB_STEP_SUMMARY"
            echo "| ✅ Passed | $passed |" >> "$GITHUB_STEP_SUMMARY"
            echo "| ❌ Failed | $failed |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **All $total tests passed** (Build with -warnaserror)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────────────────────────────
  # Coverage report (merge all platforms)
  # ──────────────────────────────────────────────
  coverage:
    name: Coverage Report
    needs: [build, integration-tests]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.x'

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: coverage-*
          path: ./coverage-raw
          merge-multiple: false

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Merge & generate report
        shell: bash
        run: |
          # Collect all Cobertura files (accounting for artifact nesting from merge-multiple: false)
          REPORTS=$(find ./coverage-raw -name 'coverage.opencover.xml' -type f | tr '\n' ';')
          if [ -z "$REPORTS" ]; then
            echo "⚠️ No coverage files found in ./coverage-raw" >> "$GITHUB_STEP_SUMMARY"
            echo "Available files:" >> "$GITHUB_STEP_SUMMARY"
            find ./coverage-raw -type f 2>/dev/null | head -20 >> "$GITHUB_STEP_SUMMARY" || echo "Directory not found or empty"
            exit 0
          fi

          reportgenerator \
            "-reports:${REPORTS}" \
            "-targetdir:./coverage-report" \
            "-reporttypes:HtmlInline_AzurePipelines;Cobertura;TextSummary;MarkdownSummaryGithub"

          # Extract line coverage percentage
          if [ -f ./coverage-report/Summary.txt ]; then
            LINE_COV=$(grep -oP 'Line coverage: \K[0-9.]+' ./coverage-report/Summary.txt || echo "N/A")
            BRANCH_COV=$(grep -oP 'Branch coverage: \K[0-9.]+' ./coverage-report/Summary.txt || echo "N/A")
          else
            LINE_COV="N/A"
            BRANCH_COV="N/A"
          fi
          echo "LINE_COVERAGE=$LINE_COV" >> "$GITHUB_ENV"
          echo "BRANCH_COVERAGE=$BRANCH_COV" >> "$GITHUB_ENV"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: ./coverage-report

      - name: Post coverage to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          header: coverage
          path: ./coverage-report/SummaryGithub.md

      - name: Post coverage summary
        shell: bash
        run: |
          echo "## 📊 Code Coverage (merged — all assemblies)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Coverage |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|----------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Line   | ${LINE_COVERAGE:-N/A}% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${BRANCH_COVERAGE:-N/A}% |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$COVERAGE_FLOOR" ] && [ "${LINE_COVERAGE:-N/A}" != "N/A" ]; then
            python3 -c "
          import sys
          cov = float('${LINE_COVERAGE}')
          floor = float('${COVERAGE_FLOOR}')
          if cov < floor:
              print(f'Coverage {cov}% below floor {floor}%')
              sys.exit(1)
          print(f'Coverage {cov}% >= floor {floor}% OK')
          "
          fi

  # ──────────────────────────────────────────────
  # SonarCloud analysis (Ubuntu only)
  # ──────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.x'

      - name: Setup Java (SonarScanner requirement)
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache SonarCloud packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: sonar-${{ runner.os }}-

      - name: Download merged coverage
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: coverage-*
          path: ./coverage-raw
          merge-multiple: false

      - name: Install SonarScanner
        run: dotnet tool install -g dotnet-sonarscanner

      - name: Build & analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        shell: bash
        run: |
          COV_PATHS=$(find ./coverage-raw -name 'coverage.opencover.xml' | paste -sd ',' -)
      
          # Skip analysis if no coverage files found
          if [ -z "$COV_PATHS" ]; then
            echo "⚠️ No coverage files found. Skipping SonarCloud analysis (workflow-only PR)."
            exit 0
          fi
      
          dotnet sonarscanner begin \
            /k:"${SONAR_PROJECT_KEY}" \
            /o:"${SONAR_ORGANIZATION}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="${COV_PATHS}" \
            /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**,**/Properties/**,**/*.Designer.cs,**/*.g.cs,**/*.axaml.cs,**/AssemblyInfo.cs,**/coverage-raw/**,**/coverage-report/**" \
            /d:sonar.coverage.exclusions="**/*.Tests/**,**/Migrations/**,**/Program.cs,**/*.axaml.cs,**/Properties/**" \
            /d:sonar.cpd.exclusions="**/*.Tests/**,**/*.g.cs" \
            /d:sonar.test.inclusions="**/*.Tests/**,**/*Tests.cs" \
            /d:sonar.scanner.skipJreProvisioning=true \
            /d:sonar.scanner.javaExePath="${JAVA_HOME}/bin/java"
      
          for proj in \
            src/Rentier.Domain/Rentier.Domain.csproj \
            src/Rentier.Application/Rentier.Application.csproj \
            src/Rentier.Infrastructure/Rentier.Infrastructure.csproj \
            src/Rentier.Desktop/Rentier.Desktop.csproj; do
            dotnet build "$proj" -c Release --no-incremental
          done
      
          dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Check Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
          
      - name: Post summary
        shell: bash
        run: |
          echo "## 🔍 SonarCloud Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Analysis submitted to [SonarCloud](https://sonarcloud.io)." >> "$GITHUB_STEP_SUMMARY"
          echo "Check the quality gate status in the PR checks." >> "$GITHUB_STEP_SUMMARY"
