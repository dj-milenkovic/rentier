# ── Source & test layout ──────────────────────────────────
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# ── Language ──────────────────────────────────────────────
sonar.language=cs

# ── Coverage ──────────────────────────────────────────────
# Path is resolved at scan time — CI will drop the file here
sonar.cs.opencover.reportsPaths=./coverage-merged/Cobertura.xml

# ── Exclusions ────────────────────────────────────────────
# Don't analyze generated or third-party code
sonar.exclusions=\
  **/Migrations/**,\
  **/obj/**,\
  **/bin/**,\
  **/*.Designer.cs,\
  **/AssemblyInfo.cs

# Don't measure coverage on tests themselves or migrations
sonar.coverage.exclusions=\
  **/*.Tests/**,\
  **/Migrations/**,\
  **/Program.cs

# Don't run duplication checks on tests
sonar.cpd.exclusions=**/*.Tests/**

# ── Analysis scope ────────────────────────────────────────
# Tells Sonar which files count as test code (different ruleset applies)
sonar.test.inclusions=**/*.Tests/**,**/*Tests.cs,**/*Spec.cs