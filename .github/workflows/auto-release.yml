name: Auto Release

# Runs on every push to main (i.e. every merged PR).
# Reads the PR title (or commit subject), computes the next semver from it,
# creates an annotated git tag, then calls the reusable release.yml pipeline.
#
# Version bump rules (Conventional Commits):
#   feat!: / fix!: / *!: or body contains "BREAKING CHANGE:" → MAJOR
#   feat: / feat(scope):                                      → MINOR
#   everything else                                           → PATCH
#
# Skip release: include [skip release] anywhere in the commit message.

on:
  workflow_dispatch:  # disabled auto-trigger; run manually when ready to release

# Serialize releases so concurrent merges never compute the same tag.
# cancel-in-progress: false ensures both releases still happen, just sequentially.
concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.x'
  PROJECT_PATH: src/Rentier.Desktop/Rentier.Desktop.csproj
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. Resolve PR title → bump type → next semver tag
  # ──────────────────────────────────────────────────────────────────
  compute-version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag:     ${{ steps.version.outputs.tag }}
      skip:    ${{ steps.skip.outputs.skip }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Check skip flag
        id: skip
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          BODY=$(git log -1 --pretty=%b)
          if echo "${SUBJECT}${BODY}" | grep -q '\[skip release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping release (\\[skip release\\] found in commit)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get PR title
        id: pr
        if: steps.skip.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_SHA:  ${{ github.sha }}
        run: |
          # Prefer the PR title from the API (works for squash, merge, and rebase strategies)
          PR_DATA=$(gh api /repos/${GH_REPO}/commits/${GH_SHA}/pulls \
            -H "Accept: application/vnd.github+json" 2>/dev/null || echo "[]")

          PR_TITLE=$(echo "${PR_DATA}" | jq -r '.[0].title // empty')
          PR_BODY=$(echo "${PR_DATA}"  | jq -r '.[0].body  // empty')

          # Fallback: use the commit subject / body
          if [ -z "${PR_TITLE}" ]; then
            PR_TITLE=$(git log -1 --pretty=%s)
            PR_BODY=$(git log -1 --pretty=%b)
          fi

          echo "title=${PR_TITLE}" >> "$GITHUB_OUTPUT"
          # Use a random delimiter so PR body content can never break the heredoc parser.
          DELIM=$(openssl rand -hex 8)
          {
            echo "body<<${DELIM}"
            echo "${PR_BODY}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

          echo "PR title: ${PR_TITLE}"

      - name: Determine bump type
        id: bump
        if: steps.skip.outputs.skip == 'false'
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY:  ${{ steps.pr.outputs.body }}
        run: |
          if echo "${PR_TITLE}" | grep -qP '^[a-z]+(\([^)]+\))?!:' || \
             echo "${PR_BODY}"  | grep -q 'BREAKING CHANGE:'; then
            BUMP="major"
          elif echo "${PR_TITLE}" | grep -qP '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "Bump: ${BUMP}"

      - name: Compute next semver
        id: version
        if: steps.skip.outputs.skip == 'false'
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          LATEST=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          [ -z "${LATEST}" ] && LATEST="v0.0.0"

          VERSION="${LATEST#v}"
          MAJOR=$(echo "${VERSION}" | cut -d. -f1)
          MINOR=$(echo "${VERSION}" | cut -d. -f2)
          PATCH=$(echo "${VERSION}" | cut -d. -f3)

          case "${BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_TAG}"         >> "$GITHUB_OUTPUT"
          echo "Previous: ${LATEST}  →  Next: ${NEW_TAG} (${BUMP} bump)"

  # ──────────────────────────────────────────────────────────────────
  # 2. Create annotated git tag
  # ──────────────────────────────────────────────────────────────────
  tag:
    name: Create git tag
    needs: compute-version
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Push annotated tag
        env:
          NEW_TAG: ${{ needs.compute-version.outputs.tag }}
          NEW_VERSION: ${{ needs.compute-version.outputs.version }}
          # GITHUB_TOKEN tag pushes don't re-trigger push.tags workflows,
          # but release.yml is invoked directly via workflow_call below.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "${NEW_TAG}"

          {
            echo "## 🏷️ Tagged ${NEW_TAG}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${NEW_VERSION}\` |"
            echo "| Tag | \`${NEW_TAG}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────
  # Windows x64 — ZIP + InnoSetup installer
  # ──────────────────────────────────────────────────────────────────
  build-windows:
    needs: [compute-version, tag]
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish win-x64
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:PublishReadyToRun=true
          -p:PublishTrimmed=false
          -p:Version=${{ needs.compute-version.outputs.version }}
          -p:AssemblyVersion=${{ needs.compute-version.outputs.version }}
          -p:FileVersion=${{ needs.compute-version.outputs.version }}
          -o ./publish/win-x64

      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path ./publish/win-x64/* -DestinationPath "./Rentier-${{ needs.compute-version.outputs.version }}-win-x64.zip"

      - name: Build InnoSetup installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "InnoSetup not found, installing via Chocolatey..."
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc `
            /DAppVersion=${{ needs.compute-version.outputs.version }} `
            /DSourcePath="$PWD\publish\win-x64" `
            /DOutputPath="$PWD" `
            /DIconPath="$PWD\Assets\Icons\rentier.ico" `
            .github\installers\rentier-setup.iss

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-win-x64
          path: |
            Rentier-*-win-x64.zip
            Rentier-*-win-x64-setup.exe
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # macOS — .app bundle + .dmg  (x64 and ARM64)
  # R2R intentionally excluded: not beneficial for Avalonia on macOS.
  # ──────────────────────────────────────────────────────────────────
  build-macos:
    needs: [compute-version, tag]
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:PublishTrimmed=false
          -p:Version=${{ needs.compute-version.outputs.version }}
          -p:AssemblyVersion=${{ needs.compute-version.outputs.version }}
          -p:FileVersion=${{ needs.compute-version.outputs.version }}
          -o ./publish/${{ matrix.rid }}

      - name: Create .app bundle
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          APP="Rentier.app"
          mkdir -p "${APP}/Contents/MacOS"
          mkdir -p "${APP}/Contents/Resources"

          cp -R publish/${RID}/* "${APP}/Contents/MacOS/"
          cp Assets/Icons/rentier.icns "${APP}/Contents/Resources/"
          chmod +x "${APP}/Contents/MacOS/Rentier.Desktop"

          cat > "${APP}/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Rentier</string>
            <key>CFBundleDisplayName</key>
            <string>Rentier</string>
            <key>CFBundleIdentifier</key>
            <string>com.rentier.desktop</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>Rentier.Desktop</string>
            <key>CFBundleIconFile</key>
            <string>rentier</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
          </dict>
          </plist>
          PLIST

      - name: Create DMG
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          brew install create-dmg

          # create-dmg returns exit code 2 when it skips setting a background
          # image (which is fine). Treat only real failures as errors.
          create-dmg \
            --volname "Rentier" \
            --volicon "Assets/Icons/rentier.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Rentier.app" 175 190 \
            --hide-extension "Rentier.app" \
            --app-drop-link 425 190 \
            "Rentier-${VERSION}-${RID}.dmg" \
            "Rentier.app" || true

          if [ ! -f "Rentier-${VERSION}-${RID}.dmg" ]; then
            echo "::error::DMG creation failed for ${RID}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.rid }}
          path: Rentier-*-${{ matrix.rid }}.dmg
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Linux x64 — tar.gz + .deb
  # R2R intentionally excluded: not beneficial for Avalonia on Linux.
  # ──────────────────────────────────────────────────────────────────
  build-linux:
    needs: [compute-version, tag]
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish linux-x64
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:PublishTrimmed=false
          -p:Version=${{ needs.compute-version.outputs.version }}
          -p:AssemblyVersion=${{ needs.compute-version.outputs.version }}
          -p:FileVersion=${{ needs.compute-version.outputs.version }}
          -o ./publish/linux-x64

      - name: Create tar.gz
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          cd publish/linux-x64
          tar -czf "../../Rentier-${VERSION}-linux-x64.tar.gz" ./*

      - name: Create .deb package
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          PKG="rentier_${VERSION}_amd64"

          mkdir -p "${PKG}/DEBIAN"
          mkdir -p "${PKG}/usr/lib/rentier"
          mkdir -p "${PKG}/usr/bin"
          mkdir -p "${PKG}/usr/share/applications"
          mkdir -p "${PKG}/usr/share/icons/hicolor/256x256/apps"

          # Copy published binary (single-file)
          cp publish/linux-x64/Rentier.Desktop "${PKG}/usr/lib/rentier/"
          chmod 755 "${PKG}/usr/lib/rentier/Rentier.Desktop"

          # Launcher symlink
          ln -s /usr/lib/rentier/Rentier.Desktop "${PKG}/usr/bin/rentier"

          # Icon
          cp Assets/Icons/png/rentier_256x256.png \
             "${PKG}/usr/share/icons/hicolor/256x256/apps/rentier.png"

          # Desktop entry
          cat > "${PKG}/usr/share/applications/rentier.desktop" << 'EOF'
          [Desktop Entry]
          Name=Rentier
          Comment=PP-OPO Tax Filing Assistant
          Exec=/usr/bin/rentier
          Icon=rentier
          Terminal=false
          Type=Application
          Categories=Finance;Office;
          EOF

          # Control file
          INSTALLED_SIZE=$(du -sk "${PKG}/usr" | cut -f1)
          cat > "${PKG}/DEBIAN/control" << EOF
          Package: rentier
          Version: ${VERSION}
          Section: finance
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_SIZE}
          Depends: libicu-dev
          Maintainer: Rentier <noreply@rentier.app>
          Description: Automated Serbian PP-OPO passive income tax filing
           Rentier automates the process of filing PP-OPO passive income
           tax returns for Serbian tax residents with foreign income.
          EOF

          dpkg-deb --build --root-owner-group "${PKG}"
          mv "${PKG}.deb" "Rentier-${VERSION}-linux-x64.deb"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-linux-x64
          path: |
            Rentier-*-linux-x64.tar.gz
            Rentier-*-linux-x64.deb
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Windows artifact smoke test — validates the built EXE is functional
  # before publishing the GitHub Release.
  # ──────────────────────────────────────────────────────────────────
  smoke-test-windows:
    name: Windows Artifact Smoke Test
    needs: [compute-version, build-windows]
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-win-x64
          path: ./artifact

      - name: Validate artifact structure
        shell: pwsh
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          $zip = Get-ChildItem ./artifact -Filter "Rentier-*-win-x64.zip" -Recurse |
            Select-Object -First 1
          if (-not $zip) { throw "Win-x64 ZIP not found in downloaded artifact" }

          Expand-Archive -Path $zip.FullName -DestinationPath ./extracted -Force

          $exe = Get-ChildItem ./extracted -Filter "Rentier.Desktop.exe" -Recurse |
            Select-Object -First 1
          if (-not $exe) { throw "Rentier.Desktop.exe missing from ZIP" }

          Write-Host "Artifact structure OK: single-file EXE present (native libs bundled inside)"
          "EXE_PATH=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV

      - name: Headless launch smoke test
        shell: pwsh
        run: |
          $proc = Start-Process $env:EXE_PATH `
            -ArgumentList "--smoke-test" -PassThru -Wait -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "Smoke test exited with code $($proc.ExitCode) — artifact is not functional"
          }
          Write-Host "SMOKE TEST PASSED (exit code 0)"

  # ──────────────────────────────────────────────────────────────────
  # Create GitHub Release with all artifacts + checksums
  # ──────────────────────────────────────────────────────────────────
  release:
    needs: [compute-version, tag, build-windows, build-macos, build-linux, smoke-test-windows]
    if: needs.compute-version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create GitHub Release + upload release assets
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify all platform artifacts present
        working-directory: dist
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          expected=(
            "Rentier-${VERSION}-win-x64.zip"
            "Rentier-${VERSION}-win-x64-setup.exe"
            "Rentier-${VERSION}-osx-arm64.dmg"
            "Rentier-${VERSION}-osx-x64.dmg"
            "Rentier-${VERSION}-linux-x64.tar.gz"
            "Rentier-${VERSION}-linux-x64.deb"
          )
          missing=0
          for f in "${expected[@]}"; do
            [ -f "$f" ] || { echo "::error::Expected release artifact missing: $f"; missing=1; }
          done
          [ "$missing" -eq 0 ] || { echo "::error::Aborting release — missing artifact(s) above."; exit 1; }
          echo "All ${#expected[@]} platform artifacts present."

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum Rentier-* | tee SHA256SUMS.txt

      - name: Generate release notes
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          {
            PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p' || true)

            if [ -n "$PREV_TAG" ]; then
              echo "## What's Changed since ${PREV_TAG}"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            else
              echo "## 🎉 Initial Release"
              echo ""
              git log --pretty=format:"- %s (%h)" --no-merges -20
            fi

            echo ""
            echo ""
            echo "## Download"
            echo ""
            echo "| Platform | Installer | Portable |"
            echo "|----------|-----------|----------|"
            echo "| Windows x64 | \`Rentier-${VERSION}-win-x64-setup.exe\` | \`Rentier-${VERSION}-win-x64.zip\` |"
            echo "| macOS ARM64 | \`Rentier-${VERSION}-osx-arm64.dmg\` | — |"
            echo "| macOS x64 | \`Rentier-${VERSION}-osx-x64.dmg\` | — |"
            echo "| Linux x64 | \`Rentier-${VERSION}-linux-x64.deb\` | \`Rentier-${VERSION}-linux-x64.tar.gz\` |"
            echo ""
            echo "## Checksums (SHA256)"
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.compute-version.outputs.tag }}
          name: Rentier ${{ needs.compute-version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/Rentier-*
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
